<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Rig Bridge</title>
<style>
  :root {
    /* Always light, regardless of the OS/browser preference — the light palette won
       out over the old dark-mode default. */
    color-scheme: light;
    --bg: #f5f5f5; --fg: #1a1a1a; --card: #ffffff; --border: #ddd;
    --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --err: #dc2626; --muted: #666;
    /* Neutral gray overlay, not a fixed color — compositing it over --card reads as a
       touch darker than the surrounding card, so dial surfaces (bars/circle/ellipse)
       stand out a little instead of blending into the background. */
    --dial-fill: rgba(127, 127, 127, .08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .status-pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; color: #fff; background: var(--muted); }
  .status-idle { background: var(--ok); }
  .status-run { background: var(--accent); }
  .status-hold, .status-door { background: var(--warn); }
  .status-alarm { background: var(--err); }
  .conn-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--err); }
  .conn-dot.ok { background: var(--ok); }
  table.pos { width: 100%; border-collapse: collapse; }
  table.pos td { padding: 3px 4px; font-variant-numeric: tabular-nums; }
  table.pos td:first-child { color: var(--muted); width: 2em; }
  textarea { width: 100%; min-height: 80px; font-family: ui-monospace, monospace; font-size: 13px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; resize: vertical; }
  .btnrow { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button { border: 1px solid var(--border); background: var(--card); color: var(--fg); padding: 7px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.warn { background: var(--warn); border-color: var(--warn); color: #fff; }
  button.err { background: var(--err); border-color: var(--err); color: #fff; }
  button:active { transform: translateY(1px); }
  #console { background: #0d0f12; color: #d7dbe0; border-radius: 8px; padding: 8px 10px; height: 220px;
    overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }
  #console div.err { color: #ff8383; }
  #console div.alarm { color: #ffb84d; }
  #console div.sent { color: #7fb3ff; }
  #console div.status { color: #8be08b; }
  .alarm-banner { background: var(--err); color: #fff; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .console-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .console-header h2 { margin: 0; }
  .console-header .btnrow { margin: 0; }
  button.small { padding: 5px 10px; font-size: 12px; }
  button.icon-btn { width: 30px; padding: 5px 0; font-size: 15px; line-height: 1; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 10px; }

  .dial-widget { display: flex; flex-direction: column; align-items: center; gap: 2px; user-select: none; }
  .dial-widget svg { touch-action: none; cursor: ns-resize; }
  .dial-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  /* Small pill overlaid on the widget's own corner instead of a caption line taking up
     its own row below — same info, less visual clutter. */
  .dial-badge { position: absolute; top: 6px; left: 10px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    background: rgba(127,127,127,.15); padding: 2px 7px; border-radius: 999px;
    pointer-events: none; line-height: 1.4; }
  .axis-box { position: relative; border: 2px solid var(--border); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; cursor: ns-resize;
    background: var(--dial-fill); touch-action: none; }
  .axis-box .dial-value { font-size: 22px; }

  /* Y (top bar, full width) / Z (right bar, under Y) / servo+table (remaining area) */
  .dials-layout { display: grid; grid-template-columns: 76% 1fr; grid-template-rows: 64px 1fr;
    gap: 6px; height: 34vh; min-height: 213px; }
  .dial-y-wrap { grid-column: 1 / span 2; grid-row: 1; display: flex; flex-direction: column; height: 100%; }
  .dial-y-wrap .axis-box { flex: 1 1 auto; width: 100%; min-height: 0; }
  .dial-z-wrap { grid-column: 2; grid-row: 2; display: flex; flex-direction: column;
    align-items: center; height: 100%; }
  .dial-z-wrap .axis-box { flex: 0 0 75%; width: 70px; align-self: center; }
  /* Servo and table overlap the same box (position:relative/absolute) instead of
     stacking in a column — an oval doesn't fill the rectangular corner it sits in, so
     the ellipse can spread underneath/behind the servo's corner and use nearly the
     whole area instead of being confined to whatever's left below it. */
  .dial-main { grid-column: 1; grid-row: 2; position: relative; min-height: 0; height: 100%; }
  /* Tucked into the top-right corner, flush against the Y bar above and the Z bar to
     the right — nudged further right (past the box edge, into the gap) so its arc
     doesn't crowd the ellipse's tip. */
  .dial-servo-wrap { position: absolute; top: 0; right: -14px; z-index: 1; }
  .dial-servo-wrap svg { width: 100px; height: 100px; }
  .dial-table-wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; }
  /* width:auto (not 100%) lets the SVG's intrinsic viewBox ratio drive its own width
     from the definite height — two independently-computed percentages here could end up
     slightly mismatched at some browser zoom levels, shrinking the effective box down to
     a sliver and making the ellipse look squashed/tiny instead of just smaller. flex:1
     with a min-height floor gives it as much of the box's height as the value/label
     below leave available. Shifted left a touch so its tip clears the tilt circle. */
  .dial-table-wrap svg { width: auto; flex: 1 1 auto; min-height: 70px; max-width: 100%;
    display: block; transform: translateX(-16px); }
  .dial-table-wrap .dial-value { flex: 0 0 auto; }
  /* Left/right continuous-rotation buttons flank the angle readout, roughly under the
     ellipse's left/right tips. padding-right clears the tilt circle's corner (it pokes
     out to right:-14px at 100px wide, i.e. ~86px past this box's own right edge) so the
     right button doesn't end up sitting underneath it. */
  .table-controls { flex: 0 0 auto; width: 100%; display: flex; align-items: center;
    justify-content: space-between; padding: 0 6px; padding-right: 96px; }
  .rotate-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border);
    background: var(--dial-fill); color: var(--fg); font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .rotate-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Dedicated stop, anchored to the widget's own bottom-right corner — separate from
     (and always available alongside) the toggle-to-stop behavior on the CW button. */
  .stop-btn { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px;
    border-radius: 50%; border: 2px solid var(--err); background: var(--card); color: var(--err);
    font-size: 10px; display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer; z-index: 1; }
  /* Fixed 50mm/F600 jog shortcuts flanking the Y bar's value. */
  .jog-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px;
    border-radius: 50%; border: 2px solid var(--border); background: var(--card); color: var(--fg);
    font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer; z-index: 1; }
  .jog-btn-left { left: 8px; }
  .jog-btn-right { right: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Scanner Rig — grblHAL bridge</h1>
  <div id="alarmBanner" class="alarm-banner"></div>

  <div class="grid">
    <div class="card">
      <h2>Стан</h2>
      <p><span id="connDot" class="conn-dot"></span><span id="connText">—</span>
         &nbsp; <span id="statusPill" class="status-pill">—</span></p>
      <table class="pos" id="posTable"></table>
      <table class="pos" id="rigTable"></table>
      <p>Feed: <b id="feedVal">0</b> &nbsp; Speed: <b id="speedVal">0</b></p>
      <div class="btnrow">
        <button onclick="rt('hold')">⏸ Hold (!)</button>
        <button onclick="rt('resume')">▶ Resume (~)</button>
        <button class="err" onclick="rt('reset')">⟲ Soft Reset</button>
      </div>
    </div>

    <div class="card">
      <h2>Надіслати G-code</h2>
      <textarea id="gcodeInput" placeholder="?&#10;G91&#10;G1 X1 F500&#10;M104 Q90"></textarea>
      <div class="btnrow">
        <button class="primary" onclick="sendGcode()">Надіслати</button>
        <button onclick="quickSend('?')">?</button>
        <button onclick="quickSend('$$')">$$</button>
        <button onclick="quickSend('$H')">$H</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <div class="dials-layout" title="Наведіть курсор на елемент і крутіть коліщатко миші, щоб перемістити.">
      <div class="dial-widget dial-y-wrap">
        <div class="axis-box" id="yBox">
          <span class="dial-badge">Y</span>
          <button type="button" class="jog-btn jog-btn-left" id="yLeftBtn"
                  title="Перемістити на 50 мм ліворуч (Y-50, F600)">←</button>
          <div class="dial-value" id="yValue">—</div>
          <button type="button" class="jog-btn jog-btn-right" id="yRightBtn"
                  title="Перемістити на 50 мм праворуч (Y+50, F600)">→</button>
        </div>
      </div>

      <div class="dial-widget dial-z-wrap">
        <div class="axis-box" id="zBox">
          <span class="dial-badge">Z</span>
          <div class="dial-value" id="zValue">—</div>
        </div>
      </div>

      <div class="dial-main">
        <div class="dial-widget dial-servo-wrap">
          <span class="dial-badge">Tilt</span>
          <svg id="servoSvg" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="60" fill="var(--dial-fill)"/>
            <path id="servoTrack" fill="none" stroke="var(--border)" stroke-width="2"/>
            <line id="servoNeedle" x1="70" y1="70" x2="70" y2="70" stroke="var(--warn)"
                  stroke-width="4" stroke-linecap="round"/>
            <circle cx="70" cy="70" r="4" fill="var(--warn)"/>
          </svg>
          <div class="dial-value" id="servoValue">—</div>
        </div>

        <div class="dial-widget dial-table-wrap">
          <span class="dial-badge">Стіл</span>
          <svg id="tableSvg" viewBox="0 0 200 70" preserveAspectRatio="xMidYMid meet">
            <ellipse cx="100" cy="35" rx="94" ry="32" fill="var(--dial-fill)" stroke="var(--border)" stroke-width="2"/>
            <ellipse cx="100" cy="35" rx="63" ry="21" fill="none" stroke="var(--border)" stroke-width="1"/>
            <ellipse cx="100" cy="35" rx="32" ry="11" fill="none" stroke="var(--border)" stroke-width="1"/>
            <line id="tableNeedle" x1="100" y1="35" x2="192" y2="35" stroke="var(--accent)"
                  stroke-width="4" stroke-linecap="round"/>
            <circle cx="100" cy="35" r="4" fill="var(--accent)"/>
          </svg>
          <div class="table-controls">
            <button type="button" class="rotate-btn" id="rotateCcwBtn"
                    title="Безперервне обертання проти годинникової стрілки (M102 P1) / зупинка (M103)">↺</button>
            <div class="dial-value" id="tableValue">—</div>
            <button type="button" class="rotate-btn" id="rotateCwBtn"
                    title="Безперервне обертання за годинниковою стрілкою (M102 P0) / зупинка (M103)">↻</button>
          </div>
          <button type="button" class="stop-btn" id="tableStopBtn" title="Зупинити обертання столу (M103)">■</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <div class="console-header">
      <h2>Консоль</h2>
      <div class="btnrow">
        <button id="modeFullBtn" class="small icon-btn" onclick="setConsoleMode('full')" title="Повний лог">☰</button>
        <button id="modeFilteredBtn" class="small icon-btn" onclick="setConsoleMode('filtered')" title="Скорочений лог">…</button>
        <button id="toggleConsoleBtn" class="small icon-btn" onclick="toggleConsoleVisible()" title="Сховати консоль">▲</button>
      </div>
    </div>
    <div id="console"></div>
  </div>

  <p class="foot">WiFi: <span id="wifiMode">—</span></p>
</div>

<script>
const AXIS_LETTERS = ['X','Y','Z','A','B','C'];

async function api(path, opts) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3000);
  try {
    const r = await fetch(path, { ...opts, signal: controller.signal });
    if (!r.ok) throw new Error(path + ': ' + r.status);
    return r;
  } finally {
    clearTimeout(timer);
  }
}

function fmt(n) { return Number(n).toFixed(3); }
function fmt2(n) { return Number(n).toFixed(2); }

let consoleMode = 'filtered';
let consoleVisible = true;
try {
  consoleMode = localStorage.getItem('consoleMode') || 'filtered';
  consoleVisible = localStorage.getItem('consoleVisible') !== 'hidden';
} catch (e) { /* private browsing etc. — defaults above are fine */ }

function setConsoleMode(mode) {
  consoleMode = mode;
  try { localStorage.setItem('consoleMode', mode); } catch (e) {}
  updateConsoleControls();
  refreshStatus();
}

function toggleConsoleVisible() {
  consoleVisible = !consoleVisible;
  try { localStorage.setItem('consoleVisible', consoleVisible ? 'shown' : 'hidden'); } catch (e) {}
  updateConsoleControls();
}

function updateConsoleControls() {
  document.getElementById('modeFullBtn').classList.toggle('primary', consoleMode === 'full');
  document.getElementById('modeFilteredBtn').classList.toggle('primary', consoleMode === 'filtered');
  document.getElementById('console').hidden = !consoleVisible;
  // Chevron points the way the click will collapse/expand — ▲ (visible, click hides)
  // matches the conventional "points toward the content it'll fold away" direction.
  const toggleBtn = document.getElementById('toggleConsoleBtn');
  toggleBtn.textContent = consoleVisible ? '▲' : '▼';
  toggleBtn.title = consoleVisible ? 'Сховати консоль' : 'Показати консоль';
}

// The board's own last_status_ms only advances while core1 (the USB/grblHAL link) is
// actually alive and parsing reports — if it stalls (bad cable, wedged USB state), the
// HTTP server can keep answering with a frozen "connected: true" forever otherwise.
// Track wall-clock time since last_status_ms last *changed*, not since we last polled.
const STALE_MS = 3000;
let lastSeenStatusMs = null;
let lastFreshWallClock = Date.now();

// No re-entrancy guard here before was letting setInterval fire a new /api/status fetch
// every 500ms even if the previous one hadn't finished yet (slower on a loaded WiFi
// link, or while the "full" console view is re-rendering its bigger, constantly
// changing content) — those pile up as concurrent connections against a server with
// only a 4-deep TCP backlog, and sending a command made it worse by firing an
// *immediate* extra refreshStatus() right on top of whatever the timer was about to do
// anyway. Skip a tick outright if the last one is still in flight.
let statusFetchInFlight = false;

function hasActiveSelectionIn(el) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
  return el.contains(sel.anchorNode) && el.contains(sel.focusNode);
}

async function refreshStatus() {
  if (statusFetchInFlight) return; // previous poll hasn't finished — don't pile another on top
  statusFetchInFlight = true;
  try {
    const r = await api('/api/status');
    const s = await r.json();
    latestStatus = s;

    if (s.last_status_ms !== lastSeenStatusMs) {
      lastSeenStatusMs = s.last_status_ms;
      lastFreshWallClock = Date.now();
    }
    const stale = s.connected && (Date.now() - lastFreshWallClock) > STALE_MS;

    document.getElementById('connDot').className = 'conn-dot' + (s.connected && !stale ? ' ok' : '');
    document.getElementById('connText').textContent = stale ? "з'єднання втрачене"
      : s.connected ? "з'єднано" : 'немає зв\'язку з grblHAL';

    const pill = document.getElementById('statusPill');
    pill.textContent = stale ? '' : (s.status || '—');
    pill.className = 'status-pill' + (stale ? '' : ' status-' + String(s.status || '').toLowerCase());

    const t = document.getElementById('posTable');
    let rows = '';
    for (let i = 0; i < (stale ? 0 : (s.naxes || 0)); i++) {
      const letter = AXIS_LETTERS[i] || ('#' + i);
      const w = s.has_wpos ? fmt(s.wpos[i]) : '—';
      const m = fmt(s.mpos[i]);
      rows += `<tr><td>${letter}</td><td>W ${w}</td><td>M ${m}</td></tr>`;
    }
    t.innerHTML = rows || '<tr><td colspan="3">—</td></tr>';

    const rig = document.getElementById('rigTable');
    let rigRows = '';
    if (!stale && s.table !== null && s.table !== undefined) {
      rigRows += `<tr><td>Стіл</td><td>${fmt2(s.table)}°</td><td>всього ${fmt2(s.table_abs)}°</td></tr>`;
    }
    if (!stale && s.servo !== null && s.servo !== undefined) {
      rigRows += `<tr><td>Сервотілт</td><td>${fmt2(s.servo)}°</td><td></td></tr>`;
    }
    rig.innerHTML = rigRows;

    if (!stale) updateDials(s);

    document.getElementById('feedVal').textContent = stale ? '—' : s.feed;
    document.getElementById('speedVal').textContent = stale ? '—' : s.speed;
    document.getElementById('wifiMode').textContent = s.wifi_mode === 'ap'
      ? `режим точки доступу (${s.ap_ssid || ''})` : 'підключено до мережі';

    const banner = document.getElementById('alarmBanner');
    if (s.alarm) { banner.style.display = 'block'; banner.textContent = s.alarm; }
    else { banner.style.display = 'none'; }

    // Don't yank the console's DOM out from under an in-progress text selection —
    // replacing innerHTML while the user is selecting (or has just finished selecting,
    // about to copy) silently clears it. Just skip this tick; the next one picks up
    // once the selection is gone.
    const c = document.getElementById('console');
    if (!hasActiveSelectionIn(c)) {
      const stick = c.scrollTop + c.clientHeight >= c.scrollHeight - 4;
      const lines = (consoleMode === 'full' ? s.console : s.console_filtered) || [];
      c.innerHTML = lines.map(line => {
        const cls = line.startsWith('ALARM') ? 'alarm'
          : line.startsWith('error') ? 'err'
          : line.startsWith('>') ? 'sent'
          : line.startsWith('<') ? 'status'
          : '';
        return `<div class="${cls}">${escapeHtml(line)}</div>`;
      }).join('');
      if (stick) c.scrollTop = c.scrollHeight;
    }
  } catch (e) {
    document.getElementById('connText').textContent = 'сторінка не бачить бридж: ' + e.message;
    document.getElementById('connDot').className = 'conn-dot';
    document.getElementById('statusPill').textContent = '';
    document.getElementById('statusPill').className = 'status-pill';
  } finally {
    statusFetchInFlight = false;
  }
}

// ---- Jog dials (table / servo / Y / Z) ----
// Screen-angle convention for all dials here: 0° points right (3 o'clock, positive
// X-axis), angle increases counter-clockwise — standard math convention, not clock
// convention. polarToXY already accounts for SVG's Y-axis pointing down, so plugging in
// a math angle directly gives the correct on-screen counter-clockwise sweep.
function polarToXY(cx, cy, r, mathDeg) {
  const rad = mathDeg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}

function setNeedle(lineEl, cx, cy, r, mathDeg) {
  const { x, y } = polarToXY(cx, cy, r, mathDeg);
  lineEl.setAttribute('x1', cx);
  lineEl.setAttribute('y1', cy);
  lineEl.setAttribute('x2', x.toFixed(2));
  lineEl.setAttribute('y2', y.toFixed(2));
}

// Table dial is drawn as an ellipse (rx > ry) rather than a circle, to read as a
// horizontal disc viewed at a slight angle ("isometric") instead of face-on.
function polarToEllipseXY(cx, cy, rx, ry, mathDeg) {
  const rad = mathDeg * Math.PI / 180;
  return { x: cx + rx * Math.cos(rad), y: cy - ry * Math.sin(rad) };
}

function setEllipseNeedle(lineEl, cx, cy, rx, ry, mathDeg) {
  const { x, y } = polarToEllipseXY(cx, cy, rx, ry, mathDeg);
  lineEl.setAttribute('x1', cx);
  lineEl.setAttribute('y1', cy);
  lineEl.setAttribute('x2', x.toFixed(2));
  lineEl.setAttribute('y2', y.toFixed(2));
}

function buildArcPath(cx, cy, r, fromDeg, toDeg, steps) {
  let d = '';
  for (let i = 0; i <= steps; i++) {
    const deg = fromDeg + (toDeg - fromDeg) * (i / steps);
    const { x, y } = polarToXY(cx, cy, r, deg);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
  }
  return d.trim();
}

// Servo hardware range ($451/$452 in the grblHAL fork) mapped onto clock-face positions:
// 130° (scanner horizontal) -> 9:30 -> 165° here; 235° (scanner down) -> 5:00 -> 300°.
// The arc sweeps through the bottom (270°), the short way between those two points.
const SERVO_MIN = 130, SERVO_MAX = 235;
const SERVO_MIN_DEG = 165, SERVO_MAX_DEG = 300;

document.getElementById('servoTrack').setAttribute(
  'd', buildArcPath(70, 70, 60, SERVO_MIN_DEG, SERVO_MAX_DEG, 40));

let latestStatus = null; // for the servo's absolute-target math (current + wheel delta)

function updateDials(s) {
  if (s.table !== null && s.table !== undefined) {
    setEllipseNeedle(document.getElementById('tableNeedle'), 100, 35, 84, 28, s.table);
    document.getElementById('tableValue').textContent = Math.round(s.table) + '°';
  }
  if (s.servo !== null && s.servo !== undefined) {
    const clamped = Math.max(SERVO_MIN, Math.min(SERVO_MAX, s.servo));
    const frac = (clamped - SERVO_MIN) / (SERVO_MAX - SERVO_MIN);
    const deg = SERVO_MIN_DEG + frac * (SERVO_MAX_DEG - SERVO_MIN_DEG);
    setNeedle(document.getElementById('servoNeedle'), 70, 70, 50, deg);
    document.getElementById('servoValue').textContent = Math.round(s.servo) + '°';
  }
  if (s.has_wpos && s.wpos[1] !== undefined) {
    document.getElementById('yValue').textContent = Math.round(s.wpos[1]);
  }
  if (s.has_wpos && s.wpos[2] !== undefined) {
    document.getElementById('zValue').textContent = Math.round(s.wpos[2]);
  }
}

// Accumulates wheel deltaY (already scaled by `sensitivity`) while the pointer sits over
// `el`, and calls `commit(total)` once ~220ms after the user stops scrolling — one
// command per gesture instead of one per wheel tick, which would otherwise flood the
// G-code queue.
function attachWheelCommand(el, sensitivity, commit) {
  let pending = 0;
  let timer = null;
  el.addEventListener('wheel', (e) => {
    // Ctrl/Cmd+wheel is the browser's page-zoom gesture — leave it alone (don't
    // preventDefault, don't treat it as a jog input) instead of hijacking it.
    if (e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    pending += e.deltaY * sensitivity;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const amount = pending;
      pending = 0;
      timer = null;
      commit(amount);
    }, 220);
  }, { passive: false });
}

// Table (M104): relative, additive on grblHAL's side already — just send the delta.
// 0.1 => ~10°/wheel click, matching M104's own example (M104 Q10).
attachWheelCommand(document.getElementById('tableSvg'), 0.1, (delta) => {
  const q = Math.round(delta);
  if (q !== 0) { stopTableRotation(); quickSend(`M104 Q${q}`); }
});

// Continuous rotation buttons (M102 P0/P1 = CW/CCW, M103 = stop) — separate from the
// wheel's bounded M104 nudge above. Click a direction to start spinning that way, click
// it again (or the other one) to change direction or stop; tracked client-side since the
// status report has no "is spinning continuously" flag to poll.
let tableRotation = null; // null | 'cw' | 'ccw'

function updateRotationButtons() {
  document.getElementById('rotateCcwBtn').classList.toggle('active', tableRotation === 'ccw');
  document.getElementById('rotateCwBtn').classList.toggle('active', tableRotation === 'cw');
}

function stopTableRotation() {
  if (tableRotation === null) return;
  tableRotation = null;
  updateRotationButtons();
}

function toggleTableRotation(dir) {
  if (tableRotation === dir) {
    tableRotation = null;
    quickSend('M103');
  } else {
    tableRotation = dir;
    quickSend(dir === 'ccw' ? 'M102 P1' : 'M102 P0');
  }
  updateRotationButtons();
}

document.getElementById('rotateCcwBtn').addEventListener('click', () => toggleTableRotation('ccw'));
document.getElementById('rotateCwBtn').addEventListener('click', () => toggleTableRotation('cw'));

// Dedicated stop: always sends M103, regardless of tracked state — covers rotation
// started some other way (e.g. a manual M102 typed into the G-code box).
document.getElementById('tableStopBtn').addEventListener('click', () => {
  tableRotation = null;
  updateRotationButtons();
  quickSend('M103');
});

// Servo (M101): absolute target, so base it on the *currently displayed* angle
// (latestStatus.servo) and clamp to the hardware range before sending.
attachWheelCommand(document.getElementById('servoSvg'), 0.05, (delta) => {
  if (!latestStatus || latestStatus.servo === null || latestStatus.servo === undefined) return;
  const target = Math.max(SERVO_MIN, Math.min(SERVO_MAX, latestStatus.servo + delta));
  quickSend(`M101 Q${target.toFixed(1)}`);
});

// Y/Z: relative jog moves. 0.02 => ~2mm per typical wheel click (Y bumped to 0.16 per
// user request — 2x, then 4x more on top of that — Z unchanged). Sign is inverted
// (negative sensitivity) vs. the table/servo dials above — scroll-down-to-move-positive
// felt backwards for these two on the real rig.
attachWheelCommand(document.getElementById('yBox'), -0.16, (delta) => {
  if (Math.abs(delta) < 0.001) return;
  quickSend(`$J=G91 Y${delta.toFixed(3)} F300`);
});
attachWheelCommand(document.getElementById('zBox'), -0.02, (delta) => {
  if (Math.abs(delta) < 0.001) return;
  quickSend(`$J=G91 Z${delta.toFixed(3)} F300`);
});

// Fixed-distance Y jog shortcuts (50mm @ F600) — separate from the wheel nudge above.
document.getElementById('yLeftBtn').addEventListener('click', () => quickSend('$J=G91 Y-50 F600'));
document.getElementById('yRightBtn').addEventListener('click', () => quickSend('$J=G91 Y50 F600'));

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

async function sendGcode() {
  const ta = document.getElementById('gcodeInput');
  const text = ta.value.trim();
  if (!text) return;
  await api('/api/gcode', { method: 'POST', body: text });
  ta.value = '';
  refreshStatus();
}

async function quickSend(line) {
  await api('/api/gcode', { method: 'POST', body: line });
  refreshStatus();
}

async function rt(which) {
  if (which === 'reset') stopTableRotation(); // soft reset kills any M102 spin too
  await api('/api/' + which, { method: 'POST' });
  refreshStatus();
}

document.getElementById('gcodeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); // otherwise a newline gets inserted right before we clear it
    sendGcode();
  }
});

updateConsoleControls();
refreshStatus();
setInterval(refreshStatus, 500);
</script>
</body>
</html>
